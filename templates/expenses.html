{% extends 'base.html' %}{% block title %}Expenses{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">THE EVERYDAY DETAILS</p><h1>Your expenses.</h1><p class="muted">Everything you’ve spent, in one tidy place.</p></div><a class="button" href="{{ url_for('web.expense_form') }}">+ Add expense</a></div>
<section class="panel"><form class="filters" method="get"><label>Search<input type="search" name="q" placeholder="Find an expense…" value="{{ request.args.get('q', '') }}" maxlength="160"></label><label>Category<select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('category') == c.id|string }}>{{ c.name }}</option>{% endfor %}</select></label><label>Month<input type="month" name="month" value="{{ request.args.get('month', '') }}"></label><button class="button secondary" type="submit">Apply filters</button><a class="text-link" href="{{ url_for('web.expenses') }}">Reset</a></form><div class="results-heading"><span><strong>{{ entries|length }}</strong> expenses <span class="subtle">·</span> <strong>{{ total|inr }}</strong> total</span><a class="text-link" href="{{ url_for('web.export', **request.args) }}">Download CSV ↓</a></div>{% include '_table.html' %}</section>{% endblock %}
